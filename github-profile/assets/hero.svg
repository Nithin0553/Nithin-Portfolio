<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="408" viewBox="0 0 1200 408" role="img" aria-labelledby="title desc">
<title id="title">Nithin Thirumani — from curiosity to code</title>
<desc id="desc">A bespoke dark graphic featuring an abstract connected neural system, with AI research, software engineering, and reliable systems as its three core themes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A111E"/><stop offset=".55" stop-color="#11192C"/><stop offset="1" stop-color="#101529"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71F5D0"/><stop offset="1" stop-color="#82B8FF"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63DDBD" stop-opacity=".68"/><stop offset="1" stop-color="#998DFE" stop-opacity=".62"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#629DFD" stop-opacity=".29"/><stop offset="1" stop-color="#629DFD" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9CB0D8" stroke-opacity=".085" stroke-width="1"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  <style>
    .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:Consolas,Menlo,monospace}
    .pulse{animation:pulse 4s ease-in-out infinite;transform-origin:970px 194px}
    .float{animation:float 6s ease-in-out infinite}
    .dash{stroke-dasharray:7 13;animation:drift 9s linear infinite}
    @keyframes pulse{0%,100%{opacity:.36;transform:scale(.97)}50%{opacity:.68;transform:scale(1.07)}}
    @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-7px)}}
    @keyframes drift{to{stroke-dashoffset:-120}}
    @media(prefers-reduced-motion:reduce){.pulse,.float,.dash{animation:none}}
  </style>
</defs>
<rect width="1200" height="408" rx="20" fill="url(#bg)"/>
<rect width="1200" height="408" rx="20" fill="url(#grid)"/>
<path d="M0 1h1200M0 407h1200" stroke="#8CA6D1" stroke-opacity=".16"/>
<circle cx="969" cy="193" r="210" fill="url(#halo)" class="pulse"/>
<g class="ui">
  <rect x="52" y="48" width="254" height="30" rx="15" fill="#66E1C1" fill-opacity=".105" stroke="#6AE6C7" stroke-opacity=".42"/>
  <circle cx="71" cy="63" r="4" fill="#71F5D0"/>
  <text x="85" y="68" fill="#9CFCE1" font-size="12" font-weight="600" letter-spacing="2">RESEARCH × ENGINEERING</text>
  <text x="50" y="153" font-size="62" font-weight="750" letter-spacing="-2" fill="#F3F7FF">NITHIN</text>
  <text x="50" y="222" font-size="62" font-weight="750" letter-spacing="-2" fill="url(#green)">THIRUMANI</text>
  <text x="53" y="264" font-size="21" fill="#C9D8EE" font-weight="500">From curiosity to code.</text>
  <text x="53" y="301" font-size="14" fill="#8EA5C8">AI / LLM Research  ·  Software Engineering  ·  Systems that scale</text>
</g>
<g class="mono">
  <path d="M53 333h520" stroke="#7CA6C9" stroke-opacity=".28"/>
  <text x="53" y="359" font-size="12" fill="#8FA6CB" letter-spacing="1.1">THINK DEEPLY</text>
  <text x="218" y="359" font-size="12" fill="#6CE4C8" letter-spacing="1.1">BUILD CAREFULLY</text>
  <text x="411" y="359" font-size="12" fill="#B8A8FF" letter-spacing="1.1">SHIP REAL VALUE</text>
</g>
<g fill="none" stroke="url(#line)">
