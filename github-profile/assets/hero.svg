  <text x="1112" y="276" fill="#E6D5FF" font-size="9">03</text>
  <text x="825" y="293" fill="#D6E9FF" font-size="9">04</text>
  <text x="819" y="73" fill="#AFA9FF">RESEARCH</text>
  <text x="1083" y="69" fill="#95EAD5">DESIGN</text>
  <text x="1112" y="315" fill="#D3BDFF">DELIVER</text>
  <text x="825" y="334" fill="#A9CAFF">EVALUATE</text>
</g>
<g class="mono" font-size="10" fill="#8298BE">
 <text x="1022" y="377" letter-spacing="2">NITHIN // 0553</text>
