  <circle cx="963" cy="193" r="85" stroke-width="1.4" stroke-opacity=".25"/>
  <path d="M963 193L819 111M963 193L1083 107M963 193L1112 272M963 193L825 289M819 111L1083 107L1112 272L825 289Z" stroke-width="1.7" stroke-opacity=".72"/>
