  <circle cx="963" cy="193" r="7" fill="#86FFE1"/>
</g>
<g class="ui" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">
  <circle cx="819" cy="111" r="25" fill="#1B2841" stroke="#8F8AFF" stroke-width="1.8"/>
